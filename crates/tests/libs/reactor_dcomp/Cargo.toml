[package]
name = "test_reactor_dcomp"
version = "0.0.0"
edition = "2024"
publish = false

# Tests for the self-hosted DirectComposition backend. Unlike `test_reactor`
# (which takes windows-reactor with default features and therefore exercises the
# WinUI backend), this crate turns the default off and selects `dcomp-backend`,
# plus the `test` feature that publishes `backend::dcomp_test_api`.
#
# Selecting that backend pulls windows-composition's `system` stack, which is
# mutually exclusive with the `lifted` stack every WinUI-backed crate needs — so
# this crate builds alongside the other system-stack crates, not in the unified
# workspace pass. See the second step in clippy.yml / test.yml.
#
#   cargo test -p test_reactor_dcomp

[dependencies]
windows-core = { workspace = true }
windows-reactor = { workspace = true, default-features = false, features = ["test", "dcomp-backend"] }

[lints]
workspace = true
