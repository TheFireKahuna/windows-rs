[package]
name = "windows-window"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows windowing library"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[dependencies]
# Names the `DisplayCapability` this crate reports and the `Scrgb` its frame colour is.
# Downward, onto a crate with no dependencies of its own.
windows-color = { workspace = true }
windows-core = { workspace = true }

[dev-dependencies]
# One example attaches real composition content: whether DWM's extended frame sits over or
# under what we draw cannot be answered by a window that draws nothing.
windows-composition = { workspace = true, features = ["system"] }
windows-numerics = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
