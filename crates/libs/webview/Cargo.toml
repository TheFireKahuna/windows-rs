[package]
name = "windows-webview"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows WebView2 library"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[features]
reactor = ["dep:windows-reactor", "dep:windows-future"]

[dependencies]
windows-core = { workspace = true }
windows-window = { workspace = true }

[dependencies.windows-reactor]
workspace = true
optional = true
# The webview bridge hosts a WebView2 in a XAML element, so it is the WinUI
# backend's to serve; reactor names no default backend.
features = ["winui-backend"]

[dependencies.windows-future]
workspace = true
optional = true

[lints]
workspace = true
