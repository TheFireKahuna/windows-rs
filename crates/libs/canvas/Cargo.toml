[package]
name = "windows-canvas"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows 2D graphics library"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[features]
default = ["reactor"]
reactor = ["windows-reactor"]

[dependencies]
windows-core = { workspace = true }
windows-numerics = { workspace = true }
windows-canvas-core = { workspace = true }

# Taken without default features so enabling canvas's `reactor` integration does
# not decide the app's backend: an app on the DComp backend keeps
# `winui-backend` off, while WinUI apps get it back through their own direct
# `windows-reactor` dependency (features unify additively).
[dependencies.windows-reactor]
workspace = true
optional = true
default-features = false

[lints]
workspace = true
