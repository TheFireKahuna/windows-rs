[package]
name = "windows-ui"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows UI framework: input, accessibility, and text services"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[dependencies]
windows-collections = { workspace = true }
windows-color = { workspace = true }
windows-core = { workspace = true }
# `Vector2` — the two-component value a composite channel carries. Named here rather than
# reached through another crate's re-export, so the dependency reads as what it is.
windows-numerics = { workspace = true }
# `RegionParts` and `SubId`. A presentation region publishes *geometry* and this crate owns
# what it means, which is the split that keeps `windows-present` free of any accessibility
# type — so one of the two has to name the other, and it is this one, downward.
windows-present = { workspace = true }
# The retained tree this framework declares into: node identity, styles, the sink
# alphabet and the flat hit array. Widget-agnostic by design, which is what keeps the
# alphabet closed.
windows-scene = { workspace = true }
# `FontSpec` — what the typography ladder resolves a role to. A font is a family id and
# four numbers, and interning the family is the text engine's job rather than this
# crate's.
windows-text = { workspace = true, features = ["d2d"] }
# `TimeSpan`, which is how the gesture recogniser states a hold delay.
windows-time = { workspace = true }
# `Event`, the waitable behind `Epoch` and the cross-thread write inbox.
windows-window = { workspace = true }

# One hash map, for the one place a structure is keyed by something the application chose
# rather than by a dense index this crate minted.
rustc-hash = { workspace = true }

[dev-dependencies]
# The scroll example drives a real tracker, which is a composition object on a real device.
# Both are deliberately absent above: this crate declares into a retained tree and never
# builds one, and keeping them dev-only is what says so.
windows-composition = { workspace = true, features = ["system"] }
windows-d2d = { workspace = true }

[lints]
workspace = true
