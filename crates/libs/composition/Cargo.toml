[package]
name = "windows-composition"
version = "0.100.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Windows composition library"
repository = "https://github.com/microsoft/windows-rs"
categories = ["os::windows-apis"]
readme = "readme.md"

[features]
default = ["system"]
system = ["dep:windows-window"]
reactor = []

[dependencies]
# `proc-macros` for `#[implement]`: `IInteractionTrackerOwner` is a callback interface
# the app side has to supply, and this crate implements it once so no generated COM
# type crosses a crate boundary to do it.
windows-core = { workspace = true, features = ["proc-macros"] }
# `std` for `IIterable<T>: From<Vec<T>>`, which is how an inertia-modifier list is
# handed to the tracker.
windows-collections = { workspace = true, features = ["std"] }
windows-numerics = { workspace = true }
# An interaction tracker's inertia decay rates take `IReference<T>` values, and that
# type is only exported under the crate's `std` feature.
windows-reference = { workspace = true, features = ["std"] }
windows-time = { workspace = true }

[dependencies.windows-window]
workspace = true
optional = true

[lints]
workspace = true

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []
